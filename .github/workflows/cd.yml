# Implantação contínua: após o CI passar, o Pulumi atualiza o ambiente e um
# teste de fumaça confere o sistema publicado.
#   push na main      -> stack dev
#   tag v* (release)  -> stack prod
#   manual            -> stack escolhido
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack a implantar
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || inputs.stack || 'dev' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Implantar ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || inputs.stack || 'dev' }}
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || inputs.stack || 'dev' }}
    env:
      STACK: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || inputs.stack || 'dev' }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: sa-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: pulumi up
        id: pulumi
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STACK }}
          work-dir: pulumi

      - name: Aguardar a CDN responder
        run: |
          for attempt in $(seq 1 20); do
            curl -sf "${{ steps.pulumi.outputs.url }}/api/health" && exit 0
            echo "Tentativa $attempt: CDN ainda propagando..."; sleep 30
          done
          exit 1

      - name: Teste de fumaça
        working-directory: pulumi
        run: uv run pytest tests/deployed
        env:
          CLASSLY_URL: ${{ steps.pulumi.outputs.url }}

      - name: Resumo
        run: |
          echo "### Classly ($STACK) implantado" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.pulumi.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
