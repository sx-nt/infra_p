services:
  dynamodb:
    image: amazon/dynamodb-local
    container_name: dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    networks: [sam-local]

  create-table:
    image: amazon/aws-cli
    depends_on: [dynamodb]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        endpoint=http://dynamodb:8000
        create_table() {
          table=$$1
          hash_key=$$2
          range_key=$${3:-}
          for i in $$(seq 1 30); do
            if aws dynamodb describe-table --table-name "$$table" --endpoint-url "$$endpoint" >/dev/null 2>&1; then
              echo "TABLE EXISTS: $$table"
              return 0
            fi
            if [ -n "$$range_key" ]; then
              if aws dynamodb create-table --table-name "$$table" \
                --attribute-definitions "AttributeName=$$hash_key,AttributeType=S" "AttributeName=$$range_key,AttributeType=S" \
                --key-schema "AttributeName=$$hash_key,KeyType=HASH" "AttributeName=$$range_key,KeyType=RANGE" \
                --billing-mode PAY_PER_REQUEST --endpoint-url "$$endpoint" >/dev/null; then
                echo "TABLE CREATED: $$table"
                return 0
              fi
            elif aws dynamodb create-table --table-name "$$table" \
              --attribute-definitions "AttributeName=$$hash_key,AttributeType=S" \
              --key-schema "AttributeName=$$hash_key,KeyType=HASH" \
              --billing-mode PAY_PER_REQUEST --endpoint-url "$$endpoint" >/dev/null; then
              echo "TABLE CREATED: $$table"
              return 0
            fi
            echo "Waiting for DynamoDB ($$i): $$table"
            sleep 1
          done
          echo "FAILED to create table: $$table"
          return 1
        }

        create_table TeachersTable teacherId
        create_table SubjectsTable subjectId
        create_table ClassesTable classId
        create_table QualificationsTable teacherId subjectId
        create_table AvailabilityTable teacherId availabilityId
        create_table SchedulesTable scheduleId
        echo "ALL TABLES READY"
    networks: [sam-local]

networks:
  sam-local:
    name: sam-local
