AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API serverless do Classly e tabelas DynamoDB do dominio academico.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: ''
        TEACHERS_TABLE: !Ref TeachersTable
        SUBJECTS_TABLE: !Ref SubjectsTable
        CLASSES_TABLE: !Ref ClassesTable
        QUALIFICATIONS_TABLE: !Ref QualificationsTable
        AVAILABILITY_TABLE: !Ref AvailabilityTable
        SCHEDULES_TABLE: !Ref SchedulesTable

Resources:
  ClasslyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  TeachersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: teachers.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTable
      Events:
        ListTeachers:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /teachers
            Method: get
        CreateTeacher:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /teachers
            Method: post
        TeacherById:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /teachers/{teacherId}
            Method: any

  SubjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: subjects.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubjectsTable
      Events:
        ListSubjects:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /subjects
            Method: get
        CreateSubject:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /subjects
            Method: post
        SubjectById:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /subjects/{subjectId}
            Method: any

  ClassesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: classes.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClassesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubjectsTable
      Events:
        ListClasses:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /classes
            Method: get
        CreateClass:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /classes
            Method: post
        ClassById:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /classes/{classId}
            Method: any

  QualificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: qualifications.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QualificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubjectsTable
      Events:
        TeacherQualification:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /teachers/{teacherId}/subjects/{subjectId}
            Method: any

  AvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: availability.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AvailabilityTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTable
      Events:
        TeacherAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /teachers/{teacherId}/availability
            Method: any

  SchedulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: schedules.handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchedulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeachersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ClassesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QualificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AvailabilityTable
      Events:
        CreateSchedule:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /schedules
            Method: post
        ValidateSchedule:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /schedules/validate
            Method: post
        ScheduleById:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /schedules/{scheduleId}
            Method: get

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: health.handler.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref ClasslyApi
            Path: /health
            Method: get

  TeachersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TeachersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teacherId
          AttributeType: S
      KeySchema:
        - AttributeName: teacherId
          KeyType: HASH

  SubjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SubjectsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subjectId
          AttributeType: S
      KeySchema:
        - AttributeName: subjectId
          KeyType: HASH

  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClassesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: classId
          AttributeType: S
      KeySchema:
        - AttributeName: classId
          KeyType: HASH

  QualificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: QualificationsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teacherId
          AttributeType: S
        - AttributeName: subjectId
          AttributeType: S
      KeySchema:
        - AttributeName: teacherId
          KeyType: HASH
        - AttributeName: subjectId
          KeyType: RANGE

  AvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AvailabilityTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teacherId
          AttributeType: S
        - AttributeName: availabilityId
          AttributeType: S
      KeySchema:
        - AttributeName: teacherId
          KeyType: HASH
        - AttributeName: availabilityId
          KeyType: RANGE

  SchedulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SchedulesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scheduleId
          AttributeType: S
      KeySchema:
        - AttributeName: scheduleId
          KeyType: HASH

Outputs:
  ApiUrl:
    Description: URL base da API do Classly.
    Value: !Sub https://${ClasslyApi}.execute-api.${AWS::Region}.amazonaws.com/v1/
